<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f5f5f5;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .app {
    max-width: 520px;
    margin: 0 auto;
    padding: 12px;
  }

  .unit-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }

  .unit-tab {
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid #ccc;
    background: white;
  }

  .unit-tab.active {
    background: black;
    color: white;
    border-color: black;
  }

  .top-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }

  button {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
    background: white;
    font-size: 14px;
  }

  .card-area { perspective: 1000px; margin: 12px 0; }

  .card-inner {
    position: relative;
    width: 100%;
    height: 55vh;
    transform-style: preserve-3d;
    transition: transform 0.4s ease;
  }

  .card-inner.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 16px;
    background: white;
    border: 1px solid #ddd;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    text-align: center;
  }

  .card-back { transform: rotateY(180deg); }

  .card-label { font-size: 12px; opacity: 0.6; margin-bottom: 10px; }

  .card-term {
    font-size: clamp(18px, 4vw, 26px);
    font-weight: 600;
  }

  .card-def {
    font-size: clamp(14px, 3.5vw, 18px);
    line-height: 1.5;
    max-width: 90%;
  }

  .hint {
    text-align: center;
    font-size: 12px;
    opacity: 0.6;
    margin-top: 6px;
  }

  .progress {
    margin-top: 10px;
    font-size: 12px;
    text-align: center;
    opacity: 0.7;
  }

  .nav-row {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
</style>
</head>

<body>
<div class="app">

  <div class="unit-tabs" id="unitTabs"></div>

  <div class="top-row">
    <button onclick="shuffleDeck()">Shuffle</button>
    <button onclick="resetDeck()">Reset</button>
    <button onclick="toggleFlip()">Flip</button>
  </div>

  <div class="card-area" id="cardArea">
    <div class="card-inner" id="cardInner">

      <div class="card-face">
        <div class="card-label">Term</div>
        <div class="card-term" id="term"></div>
      </div>

      <div class="card-face card-back">
        <div class="card-label">Definition</div>
        <div class="card-def" id="def"></div>
      </div>

    </div>
  </div>

  <!-- LEFT / RIGHT BUTTONS (requested) -->
  <div class="nav-row">
    <button onclick="prev()">← Prev</button>
    <button onclick="next()">Next →</button>
  </div>

  <div class="hint">Tap to flip • Swipe left/right also works</div>
  <div class="progress" id="progress"></div>

</div>

<script>
const ALL = [
{u:"Unit 1",t:"Spatial distribution",d:"How things are spread across Earth's surface — described by how dense, clustered, or patterned they are."},
  {u:"Unit 1",t:"Large-scale vs. small-scale map",d:"Large-scale maps show a small area in high detail (e.g., a city); small-scale maps show a large area with low detail (e.g., a continent). The 'scale' refers to the map's fraction, not the size of the area shown."},
  {u:"Unit 1",t:"Reference map",d:"A map showing where things are — roads, cities, borders, landforms. Used for navigation and finding locations (e.g., road maps, political maps)."},
  {u:"Unit 1",t:"GIS",d:"A computer system that stores and analyzes geographic data in layered maps, helping users spot patterns and relationships."},
  {u:"Unit 1",t:"GPS",d:"A satellite system that tells you your exact location (latitude and longitude) anywhere on Earth."},
  {u:"Unit 1",t:"Remote sensing",d:"Gathering data about Earth's surface from satellites or aircraft without being physically there; used to make maps and track environmental changes."},
  {u:"Unit 1",t:"Cultural landscape",d:"The visible, human-made changes to the natural environment — buildings, roads, farms — that reflect the culture of the people who created them."},
  {u:"Unit 1",t:"Relocation diffusion",d:"When an idea or cultural trait spreads because people physically move and bring it with them (e.g., immigrants bringing their religion to a new country)."},
  {u:"Unit 1",t:"Expansion diffusion – contagious",d:"When something spreads quickly in all directions through direct contact, like a disease spreading outward from its origin (e.g., early spread of Islam)."},
  {u:"Unit 1",t:"Expansion diffusion – hierarchical",d:"When something spreads from big cities down to smaller cities and towns, skipping rural areas (e.g., fashion trends spreading from NYC to smaller cities)."},
  {u:"Unit 1",t:"Expansion diffusion – stimulus",d:"The original idea doesn't spread, but the concept behind it does, and people adapt it locally (e.g., fast food spreading globally but with local menus)."},
  {u:"Unit 1",t:"Distance decay",d:"The farther apart two places are, the less they interact or influence each other."},
  {u:"Unit 1",t:"Time-space compression",d:"Technology in transportation and communication makes distant places feel closer together (coined by David Harvey)."},
  {u:"Unit 1",t:"Relative location",d:"Describing where a place is in relation to other places (e.g., 'New Jersey is southwest of New York City')."},
  {u:"Unit 1",t:"Absolute location",d:"The exact position of a place on Earth using coordinates like latitude and longitude."},
  {u:"Unit 1",t:"Place (geographic concept)",d:"A location that has human meaning attached to it through experience and memory; combines physical characteristics with emotional significance."},
  {u:"Unit 1",t:"Sense of place",d:"The feelings and emotional attachments people develop toward a specific location."},
  {u:"Unit 1",t:"Activity space",d:"The geographic area a person moves through in their daily routine (e.g., home, work, grocery store, gym)."},
  {u:"Unit 1",t:"Site",d:"The physical characteristics of a place — its terrain, soil, climate, and water sources."},
  {u:"Unit 1",t:"Situation",d:"A place's location relative to surrounding places and features; explains why a place is important or how it functions."},
  {u:"Unit 1",t:"Formal region",d:"An area defined by one or more shared, uniform characteristics (e.g., the Corn Belt defined by corn production, or a country defined by its government)."},
  {u:"Unit 1",t:"Functional/nodal region",d:"An area organized around a central hub, defined by the connections between it and surrounding areas (e.g., a metropolitan area, a TV station's broadcast range)."},
  {u:"Unit 1",t:"Perceptual/vernacular region",d:"An area defined by people's feelings and perceptions rather than hard data; it exists in people's minds (e.g., 'the South,' 'the Middle East')."},
  {u:"Unit 1",t:"Hearth",d:"The place where an idea, culture, or religion originated before spreading outward."},
  {u:"Unit 1",t:"Choropleth map",d:"A map that uses shading or colors within areas to show how intense or concentrated a variable is (e.g., population density by country)."},
  {u:"Unit 1",t:"Thematic map",d:"A map focused on one specific topic or theme (e.g., climate, religion, income) rather than general geography."},
  {u:"Unit 1",t:"Isoline map",d:"A map that uses lines connecting points of equal value to show continuous data — like contour lines for elevation or isotherms for temperature."},
  {u:"Unit 1",t:"Flow-line map",d:"A map using lines of varying thickness to show movement of people, goods, or information; thicker lines = greater volume."},
  {u:"Unit 1",t:"Dot distribution map",d:"A map where each dot represents a set amount of something, showing where a phenomenon is concentrated."},
  {u:"Unit 1",t:"Graduated symbol map",d:"A map using symbols of different sizes to show quantity at specific locations (e.g., larger circles = bigger city populations)."},
  {u:"Unit 1",t:"Cartogram",d:"A map where geographic areas are resized to be proportional to a specific variable (e.g., countries sized by their GDP, not actual area)."},
  {u:"Unit 1",t:"Mental map",d:"A person's internal, subjective image of the world based on their own knowledge and experience."},
  {u:"Unit 1",t:"Cartography",d:"The art and science of making maps."},
  {u:"Unit 1",t:"Map projections & distortion",d:"A way of showing Earth's curved surface on a flat map; every projection distorts at least one of: shape, area, distance, or direction (e.g., Mercator, Robinson, Peters)."},
  {u:"Unit 1",t:"Qualitative vs. quantitative data",d:"Qualitative data is descriptive and non-numerical (e.g., interviews). Quantitative data is numerical and measurable (e.g., population counts, GDP)."},
  {u:"Unit 1",t:"Spatial perspective",d:"Looking at the world by asking where things are, how they're arranged, and why — a core way geographers think."},
  {u:"Unit 1",t:"Environmental determinism",d:"The largely discredited idea that climate and physical environment control and determine how human cultures develop."},
  {u:"Unit 1",t:"Possibilism",d:"The idea that the environment limits but doesn't fully control humans — people can choose from multiple options within nature's constraints."},
  {u:"Unit 2",t:"Arithmetic density",d:"Total population divided by total land area; the most basic measure of how crowded a place is."},
  {u:"Unit 2",t:"Physiological density",d:"Population per unit of farmable land; shows how much pressure people put on productive land."},
  {u:"Unit 2",t:"Agricultural density",d:"Number of farmers per unit of farmable land; lower values mean more mechanized, efficient farming."},
  {u:"Unit 2",t:"DTM Stage 1 – High stationary",d:"Both birth and death rates are high, so population stays low and stable. No countries remain here today."},
  {u:"Unit 2",t:"DTM Stage 2 – Early expanding",d:"Birth rates stay high but death rates drop due to better medicine and sanitation; population grows rapidly. Linked to early industrialization."},
  {u:"Unit 2",t:"DTM Stage 3 – Late expanding",d:"Birth rates start falling while death rates continue dropping; population still grows but more slowly. Linked to urbanization and increased education."},
  {u:"Unit 2",t:"DTM Stage 4 – Low stationary",d:"Both birth and death rates are low; population stabilizes at a high level. Typical of most developed countries."},
  {u:"Unit 2",t:"DTM Stage 5 – Declining",d:"Birth rates fall below death rates, causing population to shrink. Associated with aging populations (e.g., Japan, Germany)."},
  {u:"Unit 2",t:"Total Fertility Rate (TFR)",d:"The average number of children a woman is expected to have in her lifetime. Replacement level is about 2.1."},
  {u:"Unit 2",t:"Infant Mortality Rate (IMR)",d:"The number of infant deaths (under age 1) per 1,000 live births; a key indicator of a country's healthcare quality."},
  {u:"Unit 2",t:"Life expectancy",d:"The average age a person born today is expected to live to; a key measure of quality of life and development."},
  {u:"Unit 2",t:"Crude Birth Rate (CBR)",d:"The number of live births per 1,000 people per year."},
  {u:"Unit 2",t:"Crude Death Rate (CDR)",d:"The number of deaths per 1,000 people per year."},
  {u:"Unit 2",t:"Natural Increase Rate (NIR)",d:"How fast a population grows naturally (not counting migration), calculated as CBR minus CDR."},
  {u:"Unit 2",t:"Doubling time",d:"How many years it takes for a population to double, calculated as 70 ÷ growth rate (the Rule of 70)."},
  {u:"Unit 2",t:"Population pyramid",d:"A bar graph showing a population's age and sex breakdown; the shape reveals whether a population is growing, stable, or shrinking."},
  {u:"Unit 2",t:"Population momentum",d:"A population keeps growing even after fertility drops to replacement level because there are still many young people who haven't had children yet."},
  {u:"Unit 2",t:"Sex ratio",d:"The number of males per 100 females; imbalances can result from war, gender-selective migration, or cultural son preference."},
  {u:"Unit 2",t:"Dependency ratio",d:"The ratio of non-working-age people (under 15 or over 64) to working-age people (15–64); shows the economic burden on workers."},
  {u:"Unit 2",t:"Carrying capacity",d:"The maximum population an environment can sustainably support given its available resources."},
  {u:"Unit 2",t:"Malthusian theory / Neo-Malthusianism",d:"Malthus argued population grows faster than food supply, leading to famine. Neo-Malthusians extend this to include resource depletion and environmental collapse."},
  {u:"Unit 2",t:"Overpopulation / underpopulation",d:"Overpopulation: population exceeds what the environment can support. Underpopulation: too few people to effectively use a region's resources."},
  {u:"Unit 2",t:"Pronatalist vs. antinatalist policies",d:"Pronatalist policies encourage more births (e.g., France offering financial incentives). Antinatalist policies discourage births (e.g., China's former One-Child Policy)."},
  {u:"Unit 2",t:"Migration",d:"The movement of people from one place to another with the intent to settle, either temporarily or permanently."},
  {u:"Unit 2",t:"Push/pull factors",d:"Push factors drive people away from a place (e.g., war, famine). Pull factors attract people to a destination (e.g., jobs, safety)."},
  {u:"Unit 2",t:"Forced vs. voluntary migration",d:"Voluntary: people choose to move. Forced: people are compelled to move due to conflict, persecution, or disaster (e.g., the transatlantic slave trade)."},
  {u:"Unit 2",t:"Immigration vs. emigration",d:"Immigration is moving into a country. Emigration is moving out of a country."},
  {u:"Unit 2",t:"Refugee",d:"Someone forced to flee their home country due to persecution or war, and formally recognized under international law (by the UNHCR)."},
  {u:"Unit 2",t:"Asylum seeker",d:"Someone who fled their country and applied for legal protection elsewhere but hasn't received a decision yet."},
  {u:"Unit 2",t:"IDPs (Internally Displaced Persons)",d:"People forced from their homes by conflict or disaster who remain within their own country's borders; not legally classified as refugees."},
  {u:"Unit 2",t:"Brain drain",d:"When a developing country loses skilled, educated workers because they emigrate to wealthier countries."},
  {u:"Unit 2",t:"Chain migration",d:"When migrants follow others from the same hometown to the same destination, using established social networks."},
  {u:"Unit 2",t:"Step migration",d:"Migration in stages — moving from rural area to small town to big city rather than going directly to the final destination."},
  {u:"Unit 2",t:"Transnationalism",d:"When immigrants maintain strong ties to both their home country and their new country at the same time."},
  {u:"Unit 2",t:"Guest workers / migrant workers",d:"People who temporarily move to another country to work, usually in low-wage jobs, without the right to permanently settle."},
  {u:"Unit 2",t:"Remittances",d:"Money migrants send back to their families in their home country; a major income source for many developing nations."},
  {u:"Unit 2",t:"Net migration",d:"Immigrants minus emigrants for a country; positive = more people coming in, negative = more people leaving."},
  {u:"Unit 2",t:"Gravity model",d:"A model predicting that interaction between two places increases with population size and decreases with distance."},
  {u:"Unit 2",t:"Intervening obstacles",d:"Physical or political barriers (e.g., oceans, border walls, travel costs) that make migration harder and may stop migrants from reaching their destination."},
  {u:"Unit 2",t:"Intervening opportunity",d:"A closer, more attractive option that causes a migrant to stop before reaching their original intended destination."},
  {u:"Unit 2",t:"Epidemiologic transition model",d:"As countries develop, their main causes of death shift from infectious diseases to chronic diseases like cancer and heart disease."},
  {u:"Unit 3",t:"Culture",d:"The shared beliefs, values, practices, languages, and objects that define a group of people and are passed down through generations."},
  {u:"Unit 3",t:"Material vs. nonmaterial culture",d:"Material culture = physical objects (tools, clothing, buildings). Nonmaterial culture = intangible aspects like beliefs, values, and language."},
  {u:"Unit 3",t:"Cultural trait / complex / realm",d:"A trait is a single cultural element (e.g., a language). A complex is a group of related traits (e.g., cowboy culture). A realm is a large region sharing broad cultural characteristics."},
  {u:"Unit 3",t:"Built environment",d:"Everything humans have built — buildings, roads, parks, infrastructure — that makes up our physical surroundings."},
  {u:"Unit 3",t:"Language family / branch",d:"A language family is a group of languages from a common ancestor (e.g., Indo-European). A branch is a smaller subdivision within a family (e.g., Germanic, Romance)."},
  {u:"Unit 3",t:"Dialect",d:"A regional variation of a language with different vocabulary, grammar, or pronunciation but still mutually understandable with other dialects."},
  {u:"Unit 3",t:"Lingua franca",d:"A shared language used for communication between people who speak different native languages (e.g., English globally; Swahili in East Africa)."},
  {u:"Unit 3",t:"Pidgin / Creole",d:"A pidgin is a simplified language mix used between groups for basic communication. A Creole is a pidgin that has become the native language of a community, with fuller grammar and vocabulary."},
  {u:"Unit 3",t:"Official language",d:"A language given legal status in a country, used in government, education, and law (e.g., French in France)."},
  {u:"Unit 3",t:"Isogloss",d:"A line on a map marking the boundary between areas where different words, pronunciations, or language features are used (e.g., 'soda' vs. 'pop')."},
  {u:"Unit 3",t:"Language extinction / endangered languages",d:"Language extinction: the last native speaker of a language dies. Endangered languages: declining number of speakers with risk of dying out."},
  {u:"Unit 3",t:"Universalizing religions",d:"Religions that seek converts from all people worldwide. The three main ones are Christianity, Islam, and Buddhism."},
  {u:"Unit 3",t:"Ethnic religions",d:"Religions tied to a specific ethnic group or place that don't actively seek converts (e.g., Hinduism, Judaism, Sikhism, Shintoism)."},
  {u:"Unit 3",t:"Sacred vs. secular space",d:"Sacred space has religious or spiritual meaning (e.g., Mecca, the Ganges River). Secular space is ordinary, everyday space with no religious significance."},
  {u:"Unit 3",t:"Ethnocentrism",d:"Judging other cultures by the standards of your own, often assuming your culture is superior."},
  {u:"Unit 3",t:"Cultural relativism",d:"Judging a culture by its own standards rather than outsider ones; recognizing differences don't mean inferiority."},
  {u:"Unit 3",t:"Popular vs. folk culture",d:"Popular culture is mass-produced and widespread (e.g., McDonald's, Hollywood). Folk culture is traditional, local, and tied to a specific community's identity."},
  {u:"Unit 3",t:"Acculturation",d:"When a person or group adopts some elements of another culture while keeping parts of their original culture."},
  {u:"Unit 3",t:"Assimilation",d:"When a minority group fully adopts the dominant culture and loses its original cultural identity."},
  {u:"Unit 3",t:"Syncretism",d:"When two or more cultural traditions blend to form a new hybrid (e.g., Caribbean Vodou blending West African religions with Catholicism)."},
  {u:"Unit 3",t:"Cultural convergence / divergence",d:"Convergence: cultures becoming more similar due to globalization. Divergence: cultures becoming more distinct and separate from each other."},
  {u:"Unit 3",t:"Cultural imperialism",d:"When one culture (often Western) imposes its values and products on others through economic or political power."},
  {u:"Unit 3",t:"Cultural appropriation",d:"When members of a dominant culture adopt elements of a marginalized culture without understanding or respect, often in an exploitative way."},
  {u:"Unit 3",t:"Placelessness",d:"When places lose their unique character because of mass-produced, standardized landscapes like chain restaurants and strip malls (coined by Edward Relph)."},
  {u:"Unit 3",t:"Neolocalism",d:"Deliberately celebrating and reconnecting with local culture as a pushback against globalization and placelessness (e.g., local breweries, farmers' markets)."},
  {u:"Unit 3",t:"Reterritorialization",d:"When a cultural group rebuilds and maintains its cultural identity in a new location while adapting to the new environment."},
  {u:"Unit 3",t:"Sequent occupance",d:"The idea that each culture that has occupied a place leaves its mark, so the current landscape reflects layers of all past occupants."},
  {u:"Unit 3",t:"Ethnicity",d:"A shared cultural identity based on common ancestry, language, history, and traditions; distinct from race."},
  {u:"Unit 3",t:"Diaspora",d:"The spread of a population away from its homeland, and the maintenance of cultural identity in the new locations (e.g., the African or Jewish diaspora)."},
  {u:"Unit 3",t:"Gender roles",d:"Society's expectations about behaviors and responsibilities considered appropriate for men and women."},
  {u:"Unit 3",t:"Taboo",d:"A cultural or religious ban on a specific practice, food, or behavior (e.g., pork restrictions in Islam and Judaism)."},
  {u:"Unit 3",t:"Toponym",d:"A place name; often reflects the history and culture of the people who named it (e.g., 'New York' referencing York, England)."},
  {u:"Unit 4",t:"State",d:"An independent country with defined territory, a permanent population, a government, and recognized sovereignty."},
  {u:"Unit 4",t:"Nation-state",d:"A country where the population shares a common national identity and culture, and the borders match the extent of that group (e.g., Japan, Iceland)."},
  {u:"Unit 4",t:"Stateless nation",d:"A group of people with a shared cultural identity who don't have their own independent country (e.g., Kurds, Palestinians)."},
  {u:"Unit 4",t:"Multinational state",d:"A country containing more than one significant ethnic or cultural group within its borders (e.g., Canada, Russia)."},
  {u:"Unit 4",t:"Sovereignty",d:"A state's right to govern itself without outside interference; the foundation of international relations."},
  {u:"Unit 4",t:"Self-determination",d:"The right of a group to decide its own political status and potentially form its own independent state."},
  {u:"Unit 4",t:"Territoriality",d:"The tendency of individuals or groups to claim and defend a geographic area; at the state level, a population's attachment to their defined territory."},
  {u:"Unit 4",t:"Geopolitics",d:"How geographic factors like location, resources, and terrain influence political power and international relations."},
  {u:"Unit 4",t:"Heartland / Rimland theory",d:"Mackinder's Heartland Theory: controlling inner Eurasia means controlling the world. Spykman's Rimland Theory argues coastal Eurasia is more strategically important."},
  {u:"Unit 4",t:"Compact state",d:"A roughly circular or square-shaped country, minimizing distance from center to border; easy to govern and defend (e.g., Uruguay, Poland)."},
  {u:"Unit 4",t:"Elongated state",d:"A long, narrow country; can face communication and governance challenges (e.g., Chile, Norway)."},
  {u:"Unit 4",t:"Prorupted state",d:"A compact country with a large extension sticking out, often to access resources or a coastline (e.g., Namibia's Caprivi Strip, Thailand)."},
  {u:"Unit 4",t:"Perforated state",d:"A country that completely surrounds another country (e.g., South Africa surrounds Lesotho)."},
  {u:"Unit 4",t:"Fragmented state",d:"A country whose territory is not all connected — made up of islands or separate pieces (e.g., Indonesia, the Philippines)."},
  {u:"Unit 4",t:"Landlocked state",d:"A country with no ocean access; dependent on neighbors for trade routes (e.g., Bolivia, Switzerland, Afghanistan)."},
  {u:"Unit 4",t:"Enclave / exclave",d:"An enclave is a territory surrounded by another country (e.g., Lesotho within South Africa). An exclave is a piece of a country separated from the main territory by foreign land (e.g., Alaska)."},
  {u:"Unit 4",t:"Microstate",d:"An independent country with an extremely small area or population (e.g., Monaco, Vatican City, San Marino)."},
  {u:"Unit 4",t:"Buffer state",d:"A smaller, neutral country between two rival powers that reduces the risk of direct conflict (e.g., historically, Afghanistan between Russia and Britain)."},
  {u:"Unit 4",t:"Physical boundary",d:"A border that follows a natural feature like a mountain range, river, or desert (e.g., the Pyrenees between France and Spain)."},
  {u:"Unit 4",t:"Cultural boundary",d:"A border that follows the distribution of cultural traits like language or religion (e.g., the France–Germany border reflects language differences)."},
  {u:"Unit 4",t:"Geometric boundary",d:"A straight-line border drawn along latitude or longitude, ignoring physical or cultural features (e.g., much of the U.S.–Canada border at 49°N)."},
  {u:"Unit 4",t:"Antecedent boundary",d:"A border drawn before the area was heavily settled or had significant cultural development (e.g., the western U.S.–Canada border)."},
  {u:"Unit 4",t:"Subsequent boundary",d:"A border drawn after an area is settled, taking existing cultural patterns into account (e.g., the France–Germany border evolved alongside linguistic divisions)."},
  {u:"Unit 4",t:"Superimposed boundary",d:"A border forcibly drawn by an outside power — usually colonial — without regard for existing ethnic or cultural divisions (e.g., African borders drawn during the Berlin Conference)."},
  {u:"Unit 4",t:"Relic boundary",d:"A border that no longer functions politically but still leaves visible traces on the landscape (e.g., the former Berlin Wall, Hadrian's Wall in England)."},
  {u:"Unit 4",t:"Defined / delimited / demarcated",d:"Defined: a border legally described in a treaty. Delimited: a border drawn on a map. Demarcated: a border physically marked on the ground with fences, walls, or signs."},
  {u:"Unit 4",t:"Boundary disputes",d:"Conflicts between countries over the location or interpretation of a border; types include positional, territorial, resource, and functional disputes."},
  {u:"Unit 4",t:"Gerrymandering",d:"Manipulating electoral district boundaries to benefit one political party or dilute a group's voting power."},
  {u:"Unit 4",t:"Devolution",d:"The transfer of power from a central government to regional or local governments (e.g., Scotland and Wales gaining more autonomy from the UK)."},
  {u:"Unit 4",t:"Balkanization",d:"The breakdown of a region into smaller, often hostile political units based on ethnic or cultural differences; named after the splintering of the Balkans."},
  {u:"Unit 4",t:"Ethnonationalism",d:"Nationalism based on a shared ethnic or cultural identity; can cause conflict when groups seek their own independent states."},
  {u:"Unit 4",t:"Centripetal vs. centrifugal forces",d:"Centripetal forces unify a country (e.g., shared language, strong economy). Centrifugal forces divide it (e.g., ethnic conflict, regional inequality)."},
  {u:"Unit 4",t:"Federal vs. unitary state",d:"Federal: power is split between central and regional governments (e.g., United States). Unitary: central government holds most power, with regions subordinate (e.g., France, Japan)."},
  {u:"Unit 4",t:"Confederation",d:"A loose union of independent states that keep most of their sovereignty and give only limited power to a central authority."},
  {u:"Unit 4",t:"Supranational organization",d:"An alliance of three or more countries that give up some sovereignty to a shared authority for collective benefit (e.g., the UN, EU, NATO)."},
  {u:"Unit 4",t:"EEZ (Exclusive Economic Zone)",d:"A zone extending 200 nautical miles from a country's coast where it has exclusive rights to natural resources (established under UNCLOS)."},
  {u:"Unit 4",t:"Colonialism",d:"When one country takes control of another territory, exploiting its resources and labor for the colonizer's benefit; mainly associated with European expansion from the 15th–20th centuries."},
  {u:"Unit 4",t:"Imperialism",d:"The broad practice of extending power over other territories through economic, military, or political means; colonialism is one form of imperialism."},
  {u:"Unit 4",t:"Shatterbelt",d:"A region with persistent political instability caught between major powers, with competing external influences and internal conflict (e.g., the Middle East, Cold War Eastern Europe)."},
  {u:"Unit 4",t:"Choke point",d:"A narrow, strategic location through which large amounts of traffic must pass; controlling it gives major military or economic leverage (e.g., the Strait of Hormuz, the Suez Canal)."},
  {u:"Unit 5",t:"Intensive subsistence agriculture",d:"Farmers maximize output from small plots using lots of labor — often growing rice in flooded paddies; common in densely populated parts of South and Southeast Asia."},
  {u:"Unit 5",t:"Shifting cultivation / slash-and-burn",d:"Farmers cut and burn vegetation to clear land, farm it briefly, then move on when soil fertility declines; common in tropical rainforest regions."},
  {u:"Unit 5",t:"Pastoral nomadism",d:"Herders move livestock seasonally across large areas to find fresh pasture and water; found in arid regions of Africa, the Middle East, and Central Asia."},
  {u:"Unit 5",t:"Mixed crop and livestock farming",d:"Commercial farming that combines growing crops and raising livestock, often using crops as animal feed; common in the Midwestern U.S. and Europe."},
  {u:"Unit 5",t:"Grain farming",d:"Large-scale commercial farming of staple grains (wheat, corn, rice) for sale; common in the Great Plains of North America."},
  {u:"Unit 5",t:"Dairy farming / dairying",d:"Commercial farming focused on producing milk and dairy products; must be near markets due to perishability; common in the northeastern U.S. and northern Europe."},
  {u:"Unit 5",t:"Ranching / livestock ranching",d:"Large-scale commercial grazing of cattle for beef; requires vast land and is common in arid and semi-arid regions."},
  {u:"Unit 5",t:"Mediterranean agriculture",d:"Farming in regions with wet winters and dry summers, producing wine grapes, olives, citrus, and nuts (e.g., California, Spain, Italy, Chile)."},
  {u:"Unit 5",t:"Truck farming / market gardening",d:"Intensive commercial growing of fruits, vegetables, and flowers for sale at market; requires good transportation or proximity to urban areas."},
  {u:"Unit 5",t:"Plantation agriculture",d:"Large-scale farming of a single cash crop (e.g., sugarcane, coffee) using lots of labor; historically tied to colonialism in tropical regions."},
  {u:"Unit 5",t:"Agricultural revolutions",d:"First (Neolithic): shift from hunter-gatherer to settled farming (~10,000 BCE). Second (18th–19th c.): mechanization and crop rotation. Third (Green Revolution): high-yield crops and modern inputs in developing countries."},
  {u:"Unit 5",t:"Intensive vs. extensive agriculture",d:"Intensive: lots of labor or technology on small plots to maximize output per area. Extensive: large areas with low inputs per unit (e.g., ranching, grain farming)."},
  {u:"Unit 5",t:"Subsistence vs. commercial farming",d:"Subsistence: growing food mainly for yourself. Commercial: growing food mainly to sell."},
  {u:"Unit 5",t:"Von Thünen model",d:"A model showing how land use around a central market city is determined by transportation costs; perishable and labor-intensive products are grown closer to the city."},
  {u:"Unit 5",t:"Green Revolution",d:"The mid-20th-century introduction of high-yield crop varieties, synthetic fertilizers, irrigation, and pesticides to developing countries, dramatically boosting food production."},
  {u:"Unit 5",t:"GMOs",d:"Organisms genetically modified using biotechnology to have desired traits like pest resistance, drought tolerance, or higher yield."},
  {u:"Unit 5",t:"Monoculture",d:"Growing a single crop over a large area across multiple seasons; efficient but vulnerable to disease and reduces biodiversity."},
  {u:"Unit 5",t:"Polyculture",d:"Growing multiple crops in the same space, mimicking natural diversity; more sustainable but generally less efficient than monoculture."},
  {u:"Unit 5",t:"Agribusiness",d:"The integration of agriculture into large-scale business operations — including production, processing, and distribution — dominated by major corporations."},
  {u:"Unit 5",t:"Vertical integration",d:"When a company controls multiple stages of production — in agriculture, owning farms, processing plants, and retail outlets."},
  {u:"Unit 5",t:"Commodity chains",d:"The series of steps connecting the production, processing, distribution, and consumption of a product across geographic space."},
  {u:"Unit 5",t:"Fair trade",d:"A movement ensuring farmers in developing countries get fair prices and better working conditions, reducing exploitation in global trade."},
  {u:"Unit 5",t:"Organic farming",d:"Farming without synthetic pesticides, fertilizers, or GMOs, relying on natural processes to maintain soil and crop health."},
  {u:"Unit 5",t:"Food security / insecurity",d:"Food security: everyone has reliable access to enough safe, nutritious food. Food insecurity: lacking that reliable access."},
  {u:"Unit 5",t:"Food deserts",d:"Low-income areas, often urban or rural, where residents lack access to affordable, nutritious food due to no nearby grocery stores."},
  {u:"Unit 5",t:"Food miles",d:"The distance food travels from production to consumption; used to measure the environmental impact of food transportation."},
  {u:"Unit 5",t:"Aquaculture",d:"The farming of fish, shellfish, and other aquatic organisms in controlled environments; the aquatic version of agriculture."},
  {u:"Unit 5",t:"Aquaponics",d:"A sustainable system combining fish farming with plant growing; fish waste fertilizes plants, and plants filter the water for the fish."},
  {u:"Unit 5",t:"Hydroponics",d:"Growing plants without soil in nutrient-rich water; allows food production in non-traditional environments."},
  {u:"Unit 5",t:"Irrigation",d:"Artificially supplying water to crops; makes farming possible in dry regions but can cause soil salinization and water depletion."},
  {u:"Unit 5",t:"Crop rotation",d:"Alternating the types of crops grown in a field each season to maintain soil fertility and reduce pests and disease."},
  {u:"Unit 5",t:"Double cropping",d:"Growing two crops per year on the same field; possible in tropical or subtropical climates and increases productivity."},
  {u:"Unit 5",t:"Fallow",d:"Leaving land unplanted for a season or more to let it rest and recover its fertility."},
  {u:"Unit 5",t:"Terracing",d:"Carving flat steps into hillsides to create farmable land and reduce soil erosion; common in hilly parts of South and Southeast Asia."},
  {u:"Unit 5",t:"Desertification",d:"When fertile land becomes desert due to drought, deforestation, overgrazing, or poor farming; a major issue in Africa's Sahel region."},
  {u:"Unit 5",t:"Deforestation",d:"Clearing forests for agriculture, development, or commercial use; causes habitat loss, erosion, and increased CO₂."},
  {u:"Unit 5",t:"Sustainable agriculture",d:"Farming that meets current food needs without harming the environment or reducing future generations' ability to farm."},
  {u:"Unit 5",t:"Cash crops / luxury crops",d:"Cash crops are grown to sell (e.g., cotton, tobacco, sugarcane). Luxury crops are non-essential and grown for enjoyment (e.g., coffee, tea, cocoa)."},
  {u:"Unit 5",t:"Land survey systems",d:"Metes and bounds: uses landmarks and distances to describe irregular plots (eastern U.S.). Township and range: a grid of square townships (western U.S.). Long lot: narrow strips fronting a river or road (French colonial areas, e.g., Louisiana)."},
  {u:"Unit 6",t:"Urbanization",d:"The process of more people living in cities, driven by rural-to-urban migration and natural population growth in urban areas."},
  {u:"Unit 6",t:"Suburbanization",d:"The movement of people and businesses from city cores to the surrounding suburbs, enabled by cars and highway construction."},
  {u:"Unit 6",t:"Counter-urbanization",d:"The movement of people and businesses from large cities to smaller towns and rural areas, often enabled by remote work and better transportation."},
  {u:"Unit 6",t:"Central Business District (CBD)",d:"The commercial core of a city — high land values, high-rise buildings, offices, and retail, with heavy daily commuter traffic."},
  {u:"Unit 6",t:"Suburb",d:"A lower-density residential community on the outskirts of a city, with residents who often commute to the city for work."},
  {u:"Unit 6",t:"Exurbs",d:"Communities even further from the city than suburbs — rural or semi-rural, home to wealthier commuters who can afford longer commutes."},
  {u:"Unit 6",t:"Edge city",d:"A major node of offices, retail, and commercial activity that has grown outside the traditional urban core, usually at major highway interchanges (e.g., Tysons Corner, Virginia)."},
  {u:"Unit 6",t:"Megalopolis",d:"A chain of overlapping metropolitan areas forming one massive continuous urban region (e.g., the Boston–Washington, D.C. 'BosWash' corridor)."},
  {u:"Unit 6",t:"Megacity",d:"A metropolitan area with over 10 million people (e.g., Tokyo, Mumbai, São Paulo)."},
  {u:"Unit 6",t:"Metropolitan area",d:"A large city plus its surrounding suburbs and communities; a functional urban region tied together economically."},
  {u:"Unit 6",t:"Primate city",d:"The dominant city in a country that far outpaces all others in population, economy, and culture; typically more than twice the size of the second city (e.g., Paris, Bangkok)."},
  {u:"Unit 6",t:"Rank-size rule",d:"The pattern where the second-largest city is half the size of the largest, the third is one-third the size, and so on."},
  {u:"Unit 6",t:"Hinterland",d:"The surrounding region that a city serves and draws customers from; the city's market area."},
  {u:"Unit 6",t:"Central place theory",d:"Walter Christaller's model explaining how cities are sized and spaced; higher-order cities offer more specialized goods and serve larger areas."},
  {u:"Unit 6",t:"Bid-rent theory",d:"Land prices decrease the farther you get from the CBD; different land uses (commercial, residential, agricultural) can each afford different distances from the center."},
  {u:"Unit 6",t:"Concentric zone model (Burgess)",d:"Cities grow outward in rings from the CBD: CBD → zone of transition → working-class housing → middle-class housing → commuter zone."},
  {u:"Unit 6",t:"Sector model (Hoyt)",d:"Cities grow in wedge-shaped sectors from the CBD along transportation routes; high-income areas develop along desirable corridors."},
  {u:"Unit 6",t:"Multiple nuclei model (Harris & Ullman)",d:"Cities don't grow around one CBD but around multiple activity nodes — like airports, universities, and industrial zones — each attracting related uses."},
  {u:"Unit 6",t:"Peripheral model",d:"Describes post-WWII American cities: a core surrounded by suburban rings connected by beltways, with edge cities at major interchanges."},
  {u:"Unit 6",t:"Latin American / Griffin-Ford model",d:"A model of Latin American cities with a strong CBD, an elite commercial spine, and concentric rings of decreasing quality outward to squatter settlements on the edge."},
  {u:"Unit 6",t:"World city / global city",d:"A city that plays a major role in the global economy, hosting multinational corporation headquarters, major financial markets, and international organizations (e.g., New York, London, Tokyo)."},
  {u:"Unit 6",t:"Invasion and succession",d:"When a new group or land use enters a neighborhood (invasion) and gradually replaces the existing one (succession); a key driver of neighborhood change."},
  {u:"Unit 6",t:"Ethnic enclave",d:"A neighborhood where a specific ethnic group is concentrated, maintaining its own cultural institutions, language, and businesses (e.g., Chinatown, Little Italy)."},
  {u:"Unit 6",t:"Gentrification",d:"When wealthier residents and businesses move into a low-income neighborhood, renovating it and raising costs, often displacing long-time residents."},
  {u:"Unit 6",t:"Redlining",d:"The discriminatory practice of denying loans or services to residents of minority neighborhoods; banned in the U.S. in 1968 but with lasting effects."},
  {u:"Unit 6",t:"Blockbusting",d:"A now-illegal real estate tactic in which agents scared white homeowners into selling cheaply by suggesting minorities were moving in, then resold to Black families at high prices."},
  {u:"Unit 6",t:"White flight",d:"The large-scale movement of white residents out of racially mixed urban neighborhoods into suburbs, especially in mid-20th century America."},
  {u:"Unit 6",t:"Urban renewal",d:"Government programs that demolished deteriorating urban areas and replaced them with new development, often displacing low-income and minority residents (mainly 1950s–1970s U.S.)."},
  {u:"Unit 6",t:"Brownfield vs. greenfield development",d:"Brownfields: previously developed, often contaminated land (e.g., old industrial sites) that can be redeveloped. Greenfields: undeveloped or agricultural land on the urban edge used for new construction."},
  {u:"Unit 6",t:"Mixed-use development",d:"Planning that puts residential, commercial, and sometimes industrial uses close together; promotes walkability and reduces car dependence."},
  {u:"Unit 6",t:"Zoning",d:"Legally dividing a city into districts where specific land uses are allowed or prohibited — separating residential, commercial, industrial, and agricultural areas."},
  {u:"Unit 6",t:"Urban sprawl",d:"Uncontrolled, low-density expansion of cities into surrounding rural land; typically car-dependent and costly environmentally and socially."},
  {u:"Unit 6",t:"Urban heat island",d:"Cities are significantly warmer than surrounding rural areas due to dark surfaces, human activities, and reduced vegetation."},
  {u:"Unit 6",t:"Squatter settlements / informal settlements / slums",d:"Areas where residents illegally occupy urban land and build their own housing, usually lacking basic services; found on the edges of rapidly growing cities in developing countries (e.g., favelas in Brazil)."},
  {u:"Unit 6",t:"Smart growth",d:"Planning strategies that encourage compact, walkable, transit-friendly, and environmentally sustainable development to combat urban sprawl."},
  {u:"Unit 6",t:"New urbanism",d:"An urban design movement promoting walkable, mixed-use, human-scaled neighborhoods that build community and reduce car dependence."},
  {u:"Unit 6",t:"Public housing",d:"Government-owned residential buildings providing affordable housing for low-income residents."},
  {u:"Unit 6",t:"Commuter rail",d:"Passenger rail connecting suburbs to city centers during peak hours; reduces car traffic and congestion."},
  {u:"Unit 6",t:"Deindustrialization",d:"The decline of manufacturing in a region, leading to job losses and economic hardship (e.g., the U.S. Rust Belt)."},
  {u:"Unit 7",t:"Gross Domestic Product (GDP)",d:"The total value of all goods and services produced within a country in a year; a basic measure of economic output."},
  {u:"Unit 7",t:"GDP per capita",d:"GDP divided by population; shows the average economic output per person and is used to compare living standards between countries."},
  {u:"Unit 7",t:"GNI (Gross National Income)",d:"Total income earned by a country's residents, including income from abroad; slightly different from GDP."},
  {u:"Unit 7",t:"PPP (Purchasing Power Parity)",d:"An adjustment to economic data accounting for differences in cost of living, allowing more accurate comparisons of real purchasing power between countries."},
  {u:"Unit 7",t:"Human Development Index (HDI)",d:"A UN index measuring human development using three factors: life expectancy, education (years of schooling), and income (GNI per capita)."},
  {u:"Unit 7",t:"Gender Inequality Index (GII)",d:"A UN measure of gender inequality using reproductive health, political empowerment, education levels, and labor force participation."},
  {u:"Unit 7",t:"Primary sector",d:"Economic activities that extract raw materials directly from nature — farming, fishing, forestry, and mining."},
  {u:"Unit 7",t:"Secondary sector",d:"Economic activities that process raw materials into finished goods — manufacturing and construction."},
  {u:"Unit 7",t:"Tertiary sector",d:"Economic activities that provide services rather than goods — retail, transportation, healthcare, finance, and education."},
  {u:"Unit 7",t:"Quaternary sector",d:"Economic activities focused on information, research, and knowledge — IT, consulting, and media."},
  {u:"Unit 7",t:"Quinary sector",d:"The highest level of decision-making in an economy — top executives, senior government officials, and top-level managers."},
  {u:"Unit 7",t:"Core / periphery / semi-periphery",d:"Core: wealthy, industrialized nations dominating global trade. Periphery: poorer nations exporting raw materials to the core. Semi-periphery: in between — industrializing but still partially exploited (e.g., Brazil, China, Mexico)."},
  {u:"Unit 7",t:"World-systems theory",d:"Immanuel Wallerstein's theory that the global economy is a capitalist system where wealth flows from poorer periphery nations to wealthy core nations."},
  {u:"Unit 7",t:"Dependency theory",d:"The idea that developing nations are poor not because of internal failures but because of ongoing exploitation by wealthy nations through colonial and trade relationships."},
  {u:"Unit 7",t:"Rostow's stages of economic growth",d:"A model proposing five stages all countries move through: (1) traditional society, (2) preconditions for takeoff, (3) takeoff, (4) drive to maturity, (5) high mass consumption."},
  {u:"Unit 7",t:"Neoliberalism",d:"An economic ideology favoring free markets, deregulation, privatization, and reduced government involvement; dominant in global development policy since the 1980s."},
  {u:"Unit 7",t:"Structural adjustment programs (SAPs)",d:"Loan conditions imposed by the World Bank and IMF requiring deregulation, privatization, and spending cuts; often criticized for worsening poverty."},
  {u:"Unit 7",t:"TNCs / MNCs",d:"Companies operating in multiple countries, managing production and sales across national borders; major drivers of globalization."},
  {u:"Unit 7",t:"Foreign Direct Investment (FDI)",d:"When a company or government in one country invests in business operations in another country."},
  {u:"Unit 7",t:"Industrialization",d:"The shift from an agricultural to a manufacturing-based economy; associated with urbanization and rising living standards."},
  {u:"Unit 7",t:"Import substitution",d:"A development strategy where a country produces domestically what it previously imported, reducing dependence on foreign goods."},
  {u:"Unit 7",t:"Export-oriented industrialization",d:"A development strategy focused on manufacturing goods for export to wealthier countries, often using low labor costs to attract foreign investment (e.g., South Korea, China)."},
  {u:"Unit 7",t:"Outsourcing / offshoring",d:"Outsourcing: hiring outside companies to handle business functions. Offshoring: moving those functions to another country, usually for lower labor costs."},
  {u:"Unit 7",t:"SEZ / EPZ",d:"Special zones within a country where different business laws apply — offering tax breaks and looser regulations to attract foreign investment (e.g., China's Special Economic Zones)."},
  {u:"Unit 7",t:"Agglomeration",d:"The clustering of businesses and industries in one area to share resources, labor, and infrastructure; reduces costs through proximity."},
  {u:"Unit 7",t:"Growth pole",d:"A highly developed urban area or industry that stimulates economic growth in the surrounding region."},
  {u:"Unit 7",t:"Technopole",d:"A planned region developed to attract high-tech industries, research institutions, and skilled workers (e.g., Silicon Valley, Bangalore)."},
  {u:"Unit 7",t:"Rust belt / sun belt",d:"Rust Belt: formerly industrial northeastern/Midwestern U.S. that declined with deindustrialization. Sun Belt: warm southern and western U.S. states that grew rapidly in the late 20th century."},
  {u:"Unit 7",t:"Multiplier effect",d:"When a new industry creates additional jobs and income indirectly, as workers spend money locally and supporting businesses grow."},
  {u:"Unit 7",t:"Comparative advantage",d:"A country should specialize in what it produces most efficiently relative to other goods — the basis of free trade theory."},
  {u:"Unit 7",t:"Absolute advantage",d:"A country has an absolute advantage if it can produce more of a good per unit of input than another country."},
  {u:"Unit 7",t:"Free trade / protectionism",d:"Free trade: no barriers to international exchange of goods. Protectionism: using tariffs, quotas, or subsidies to shield domestic industries from foreign competition."},
  {u:"Unit 7",t:"Quotas / tariffs / subsidies",d:"Quotas: limits on imported goods. Tariffs: taxes on imports that raise their price. Subsidies: government payments to domestic producers to keep them competitive."},
  {u:"Unit 7",t:"Just-in-time delivery",d:"A production strategy where goods are delivered exactly when needed, cutting storage costs and improving efficiency."},
  {u:"Unit 7",t:"Informal economy",d:"Economic activity outside of government regulation and taxation — street vending, unregistered businesses, informal labor; common in developing countries."},
  {u:"Unit 7",t:"Microfinance / microlending",d:"Providing small loans to low-income individuals who lack access to traditional banks; aims to reduce poverty and encourage entrepreneurship."},
  {u:"Unit 7",t:"Sustainable development",d:"Development that meets today's needs without preventing future generations from meeting theirs; balances economic growth, environmental protection, and social equity (Brundtland Commission, 1987)."},
  {u:"Unit 7",t:"Circular economy",d:"An economic model that eliminates waste by keeping resources in use through reuse, repair, and recycling; contrasts with the traditional 'take-make-dispose' approach."},
  {u:"Unit 7",t:"Gig economy",d:"A labor market based on short-term contracts and freelance work rather than permanent jobs (e.g., Uber drivers, Airbnb hosts, freelancers)."},
  {u:"Unit 7",t:"Economic development",d:"The process of improving a country's economic, political, and social well-being; measured by GDP, HDI, and other quality-of-life indicators."}
];

let deck = [...ALL];
let i = 0;
let flipped = false;
let activeUnit = "All";

function renderTabs() {
  const units = ["All","Unit 1","Unit 2","Unit 3","Unit 4","Unit 5","Unit 6","Unit 7"];
  const el = document.getElementById("unitTabs");
  el.innerHTML = "";

  units.forEach(u => {
    const b = document.createElement("button");
    b.className = "unit-tab" + (u === activeUnit ? " active" : "");
    b.textContent = u;
    b.onclick = () => {
      activeUnit = u;
      deck = u === "All" ? [...ALL] : ALL.filter(x => x.u === u);
      i = 0;
      render();
      renderTabs();
    };
    el.appendChild(b);
  });
}

function render() {
  if (!deck.length) return;

  document.getElementById("term").textContent = deck[i].t;
  document.getElementById("def").textContent = deck[i].d;

  document.getElementById("progress").textContent =
    `${i + 1} / ${deck.length}`;
}

function next() {
  i = (i + 1) % deck.length;
  flipped = false;
  document.getElementById("cardInner").classList.remove("flipped");
  render();
}

function prev() {
  i = (i - 1 + deck.length) % deck.length;
  flipped = false;
  document.getElementById("cardInner").classList.remove("flipped");
  render();
}

function toggleFlip() {
  flipped = !flipped;
  document.getElementById("cardInner").classList.toggle("flipped");
}

function shuffleDeck() {
  deck.sort(() => Math.random() - 0.5);
  i = 0;
  render();
}

function resetDeck() {
  deck = activeUnit === "All" ? [...ALL] : ALL.filter(x => x.u === activeUnit);
  i = 0;
  render();
}

/* swipe */
let startX = 0;
document.getElementById("cardArea").addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.getElementById("cardArea").addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
});

/* tap flip */
document.getElementById("cardArea").onclick = toggleFlip;

renderTabs();
render();
</script>

</html>
