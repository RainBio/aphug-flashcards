<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f5f5f5;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .app {
    max-width: 520px;
    margin: 0 auto;
    padding: 12px;
  }

  .unit-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }

  .unit-tab {
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid #ccc;
    background: white;
  }

  .unit-tab.active {
    background: black;
    color: white;
    border-color: black;
  }

  .top-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }

  button {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
    background: white;
    font-size: 14px;
  }

  .card-area {
    perspective: 1000px;
    margin: 12px 0;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 55vh;
    transform-style: preserve-3d;
    transition: transform 0.4s ease;
  }

  .card-inner.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    border-radius: 16px;
    background: white;
    border: 1px solid #ddd;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 20px;
    text-align: center;
  }

  .card-back {
    transform: rotateY(180deg);
  }

  .card-label {
    font-size: 12px;
    opacity: 0.6;
    margin-bottom: 10px;
  }

  .card-term {
    font-size: clamp(18px, 4vw, 26px);
    font-weight: 600;
  }

  .card-def {
    font-size: clamp(14px, 3.5vw, 18px);
    line-height: 1.5;
    max-width: 90%;
  }

  .hint {
    text-align: center;
    font-size: 12px;
    opacity: 0.6;
    margin-top: 6px;
  }

  .progress {
    margin-top: 10px;
    font-size: 12px;
    text-align: center;
    opacity: 0.7;
  }
</style>
</head>

<body>
<div class="app">

  <div class="unit-tabs" id="unitTabs"></div>

  <div class="top-row">
    <button id="shuffleBtn">Shuffle</button>
    <button id="resetBtn">Reset</button>
    <button id="flipBtn">Flip</button>
  </div>

  <div class="card-area" id="cardArea">
    <div class="card-inner" id="cardInner">

      <div class="card-face">
        <div class="card-label">Term</div>
        <div class="card-term" id="term"></div>
      </div>

      <div class="card-face card-back">
        <div class="card-label">Definition</div>
        <div class="card-def" id="def"></div>
      </div>

    </div>
  </div>

  <div class="hint">Tap to flip • Swipe left/right to navigate</div>
  <div class="progress" id="progress"></div>

</div>

<script>
const ALL = [
  {u:"Unit 1",t:"Spatial distribution",d:"Arrangement of a phenomenon across Earth."},
  {u:"Unit 1",t:"GIS",d:"System for capturing and analyzing spatial data."},
  {u:"Unit 2",t:"DTM Stage 2",d:"High birth rate, falling death rate, rapid growth."},
  {u:"Unit 3",t:"Culture",d:"Shared beliefs, values, and practices."}
];

let deck = [...ALL];
let i = 0;
let flipped = false;

function render() {
  document.getElementById("term").textContent = deck[i].t;
  document.getElementById("def").textContent = deck[i].d;
  document.getElementById("progress").textContent =
    `${i + 1} / ${deck.length}`;
}

function next() {
  i = (i + 1) % deck.length;
  flipped = false;
  document.getElementById("cardInner").classList.remove("flipped");
  render();
}

function prev() {
  i = (i - 1 + deck.length) % deck.length;
  flipped = false;
  document.getElementById("cardInner").classList.remove("flipped");
  render();
}

function toggleFlip() {
  flipped = !flipped;
  document.getElementById("cardInner").classList.toggle("flipped");
}

document.getElementById("cardArea").onclick = toggleFlip;
document.getElementById("flipBtn").onclick = toggleFlip;
document.getElementById("shuffleBtn").onclick = () => {
  deck.sort(() => Math.random() - 0.5);
  i = 0;
  render();
};
document.getElementById("resetBtn").onclick = () => {
  deck = [...ALL];
  i = 0;
  render();
};

// Swipe support
let startX = 0;

document.getElementById("cardArea").addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.getElementById("cardArea").addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;
  let diff = endX - startX;

  if (Math.abs(diff) > 40) {
    diff < 0 ? next() : prev();
  }
});

render();
</script>

</body>
</html>
